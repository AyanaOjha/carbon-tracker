version: '3.8'

services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbon-tracker-backend-1
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-1
      - MONGO_URI=${MONGO_URI:-mongodb+srv://student:demo123@cluster0.mongodb.net/carbon-tracker?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-carbon_secret_jwt_key_2026}
    ports:
      - "5001:5000"
    restart: unless-stopped
    networks:
      - carbon_network

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbon-tracker-backend-2
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-2
      - MONGO_URI=${MONGO_URI:-mongodb+srv://student:demo123@cluster0.mongodb.net/carbon-tracker?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-carbon_secret_jwt_key_2026}
    ports:
      - "5002:5000"
    restart: unless-stopped
    networks:
      - carbon_network

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbon-tracker-backend-3
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-3
      - MONGO_URI=${MONGO_URI:-mongodb+srv://student:demo123@cluster0.mongodb.net/carbon-tracker?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-carbon_secret_jwt_key_2026}
    ports:
      - "5003:5000"
    restart: unless-stopped
    networks:
      - carbon_network

  nginx:
    image: nginx:alpine
    container_name: carbon-tracker-nginx-lb
    ports:
      - "80:80"
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - carbon_network

networks:
  carbon_network:
    driver: bridge
