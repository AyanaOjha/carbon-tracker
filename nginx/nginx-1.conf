# ONE backend instance (used for the "1 instance" load test)
events { worker_connections 1024; }

http {
  log_format lb '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr time=$request_time';
  access_log /var/log/nginx/access.log lb;

  upstream backend {
    server app1:5000;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 1s;
      proxy_next_upstream off;
    }
  }
}
