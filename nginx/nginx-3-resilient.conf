# THREE backend instances with FAILOVER (Question 1c "after").
# If an instance is down, Nginx marks it unavailable and retries the
# request on a healthy instance, so the user never sees an error.
events { worker_connections 1024; }

http {
  log_format lb '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr time=$request_time';
  access_log /var/log/nginx/access.log lb;

  upstream backend {
    server app1:5000 max_fails=1 fail_timeout=10s;
    server app2:5000 max_fails=1 fail_timeout=10s;
    server app3:5000 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
      proxy_next_upstream_tries 3;
    }
  }
}
