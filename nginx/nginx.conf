events {
    worker_connections 1024;
}

http {
    # Upstream backend cluster with 3 replicas
    upstream backend_cluster {
        # Round-robin by default
        server backend1:5000 max_fails=1 fail_timeout=5s;
        server backend2:5000 max_fails=1 fail_timeout=5s;
        server backend3:5000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Logging format including upstream response time and target server
        log_format upstreamlog '[$time_local] $remote_addr to: $upstream_addr: $request '
                               'upstream_response_time $upstream_response_time '
                               'msec $msec request_time $request_time status $status';
        access_log /var/log/nginx/access.log upstreamlog;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Pass request headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Custom response header from Nginx
            add_header X-Load-Balancer "Nginx-Reverse-Proxy" always;

            # High-Availability Failover Configuration (Question 1c)
            # If any backend returns an error or timeout, immediately retry the next upstream server
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }
}
